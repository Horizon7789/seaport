name: Security - Contract Order Generate/Ratify PoC

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/security-contract-order-poc.yml'
      - 'test/**'
      - 'contracts/**'
      - 'lib/**'
      - 'src/**'

permissions:
  contents: read

jobs:
  contract-order-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npx hardhat compile

      - name: Run contract-order security PoC
        run: |
          set -o pipefail
          if [ -f test/foundry/ContractOrderRatifySecurity.t.sol ]; then
            forge test --match-contract ContractOrderRatifySecurity -vvv 2>&1 | tee contract-order-poc.log
          elif [ -f test/ContractOrderRatifySecurity.t.sol ]; then
            forge test --match-contract ContractOrderRatifySecurity -vvv 2>&1 | tee contract-order-poc.log
          else
            echo 'No ContractOrderRatifySecurity PoC exists yet; failing closed.' | tee contract-order-poc.log
            exit 1
          fi

      - name: Upload PoC log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-order-poc-log
          path: contract-order-poc.log
          if-no-files-found: ignore
