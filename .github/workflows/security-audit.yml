name: Security Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Contract Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4

      - name: Install dependencies
        run: forge install

      - name: Build optimized contracts
        run: FOUNDRY_PROFILE=optimized forge build

      - name: Run Foundry tests
        run: FOUNDRY_PROFILE=test forge test -vvv

      - name: Install Slither
        run: pipx install slither-analyzer

      - name: Run Slither static analysis
        run: |
          set -o pipefail
          slither . --exclude-dependencies --print human-summary 2>&1 | tee slither-summary.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: slither-summary.txt
          if-no-files-found: warn
